name: CI

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        node-version: [20, 22, 24]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}
          cache: npm
      - run: npm ci
      - name: Test portable core and skills
        if: matrix.node-version == 20
        run: npx vitest run packages/core packages/memory-skills
      - name: Test all packages
        if: matrix.node-version != 20
        run: npm test
      - run: npm run typecheck
      - run: npm run build
      - run: npm audit --omit=dev
      - name: Pack Pi extension
        if: matrix.node-version != 20
        run: npm pack --dry-run ./packages/pi-memory
      - run: npm pack --dry-run ./packages/memory-skills
